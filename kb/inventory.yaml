# Device inventory (Infrastructure Layer contract).
#
# platform selects the vendor module (ibn/platforms). Only cisco_ios exists today; adding e.g.
# juniper_junos or arista_eos means adding one platform module - nothing else changes.
#
# mgmt: how the Control Layer reaches the device (see README "Connecting EVE-NG").
#   - Recommended: connect a spare port of every node to an EVE-NG "Management(Cloud0)" network and
#     enable SSH:  transport: ssh, host: <device management IP>, port: 22
#   - Quick alternative: the node's EVE-NG telnet console:
#       transport: telnet, host: <EVE-NG IP>, port: <console port shown in EVE-NG, e.g. 32769>
#   interface: the management interface. IBN never changes it and leaves it out of simulations.
#     Do NOT add it to topology.yaml.
# Credentials are NEVER stored here - only the names of environment variables holding them.

defaults:
  vendor: cisco
  platform: cisco_ios
  credentials:
    username_env: IBN_USERNAME
    password_env: IBN_PASSWORD
    secret_env: IBN_ENABLE_SECRET

devices:
  R1:
    role: router
    os_version: "IOL 15.x"
    mgmt: {host: 192.168.100.11, port: 22, transport: ssh, interface: Ethernet0/3}
  R2:
    role: router
    os_version: "IOL 15.x"
    mgmt: {host: 192.168.100.12, port: 22, transport: ssh, interface: Ethernet0/3}
  R3:
    role: router
    os_version: "IOL 15.x"
    mgmt: {host: 192.168.100.13, port: 22, transport: ssh, interface: Ethernet0/3}
  SW1:
    role: switch
    os_version: "IOL-L2 15.x"
    mgmt: {host: 192.168.100.21, port: 22, transport: ssh, interface: Vlan99}
  SW3:
    role: switch
    os_version: "IOL-L2 15.x"
    mgmt: {host: 192.168.100.23, port: 22, transport: ssh, interface: Vlan99}

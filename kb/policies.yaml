# Organisation-wide policies and guardrails, read by every layer.

# Posture of IBN-managed ACLs once all intent rules are evaluated.
# "permit" keeps today's open network and only adds the restrictions intents ask for.
default_acl_action: permit

# Infrastructure subnets. A change that alters traffic where BOTH ends are inside these
# (routing adjacencies, GRE tunnel, router-to-router management) is rejected.
protected_subnets:
  - 10.1.2.0/24   # R1-R2
  - 10.2.3.0/24   # R2-R3
  - 10.1.3.0/24   # R1-R3 tunnel

# VLANs the AI may create, and VLANs that must never be created.
vlan_range: [100, 999]
reserved_vlans: [1, 1002, 1003, 1004, 1005]

# Enforce the 10.x.y.0/24 (x<y) point-to-point addressing convention in `ibn kb check`.
p2p_convention: true

# Every object the AI creates (ACLs, class-maps, route-maps, ...) must start with this prefix.
object_prefix: IBN_

# Commands the AI must never generate (regular expressions, matched per line, case-insensitive).
forbidden_commands:
  - pattern: '^\s*(do\s+)?(reload|write|copy|erase|delete|format|squeeze|clear)\b'
    reason: exec commands are not configuration
  - pattern: '^\s*no\s+ip\s+routing\b'
    reason: disables routing on the device
  - pattern: '^\s*crypto\s+key\s+zeroize'
    reason: destroys the SSH keys used for management
  - pattern: '^\s*(no\s+)?(username|enable\s+(secret|password)|aaa)\b'
    reason: credential and AAA changes are not allowed
  - pattern: '^\s*(no\s+)?line\s+(vty|con)'
    reason: could lock IBN out of the device
  - pattern: '^\s*(no\s+)?(boot|config-register)\b'
    reason: boot settings
  - pattern: '^\s*no\s+router\s'
    reason: removes a whole routing process

# Independent AI review of every design: "error" findings block the plan when true.
llm_review_blocking: true
# How many times a rejected design is sent back to the AI for correction.
max_design_attempts: 3

deployment:
  # Staged rollout: devices are configured one at a time in this role order.
  stage_order: [switch, router]
  auto_rollback: true
  save_config: false
  # Extra traffic probes run (from routers) after every deployment.
  probe_services: ["icmp", "tcp/22", "tcp/80", "tcp/443", "udp/53"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ibn"
version = "0.1.0"
description = "Intent-Based Networking: natural-language intents -> validated, deployed network config"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6",
  "jinja2>=3.1",
  "typer>=0.12",
  "rich>=13",
  "requests>=2.31",
  "netmiko>=4.3",
]

[project.optional-dependencies]
batfish = ["pybatfish"]
dev = ["pytest>=8"]

[project.scripts]
ibn = "ibn.cli:main"

[tool.setuptools.packages.find]
include = ["ibn*"]

[tool.setuptools.package-data]
"ibn.translation.drivers" = ["templates/**/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ibn"
version = "0.2.0"
description = "Intent-Based Networking: natural-language intents -> validated, deployed network config"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "requests>=2.31",
  "netmiko>=4.3",
]

[project.optional-dependencies]
batfish = ["pybatfish"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
ibn-web = "ibn.web.app:main"

[tool.setuptools.packages.find]
include = ["ibn*"]

[tool.setuptools.package-data]
"ibn.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
